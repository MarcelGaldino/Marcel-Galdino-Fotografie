<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marcel Galdino Fotografie</title>
<meta name="description" content="Natürliche, zeitlose Fotografie für Familien, Paare & Newborns – ruhig, geführt und echt.">

<style>
:root{
  --bg:#faf7f2;
  --bg-soft:#fffaf4;
  --beige:#e8dccb;
  --brown:#6d5c4a;
  --text:#3a332c;
  --white:#ffffff;
  --shadow:0 10px 30px rgba(0,0,0,.06);
  --radius:16px;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
  background:linear-gradient(180deg,var(--bg),var(--bg-soft));
  color:var(--text);
  line-height:1.6;
}

header{
  position:sticky;
  top:0;
  background:rgba(250,247,242,.9);
  backdrop-filter:blur(8px);
  border-bottom:1px solid rgba(0,0,0,.05);
  z-index:10;
}

.nav{
  max-width:1100px;
  margin:auto;
  padding:14px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  text-decoration:none;
  color:inherit;
  font-weight:700;
}

.brand img{height:42px}

nav a{
  margin-left:16px;
  text-decoration:none;
  color:var(--text);
  font-weight:600;
}

.hero{
  max-width:1100px;
  margin:80px auto 40px;
  padding:0 20px;
  display:grid;
  grid-template-columns:1.2fr .8fr;
  gap:40px;
}

.hero-card{
  background:var(--white);
  padding:40px;
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}

.hero h1{
  font-size:clamp(30px,4vw,44px);
  line-height:1.15;
  margin:0 0 12px;
}

.hero p{
  margin:0 0 16px;
}

.btn{
  display:inline-block;
  margin-top:14px;
  padding:12px 22px;
  border-radius:999px;
  background:var(--brown);
  color:white;
  text-decoration:none;
  font-weight:700;
}
